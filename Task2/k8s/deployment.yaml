apiVersion: apps/v1
kind: Deployment

metadata:
  name: insuretech-app
  namespace: insuretech

spec:
  replicas: 1

  selector:
    matchLabels:
      app: insuretech-app

  template:
    metadata:
      labels:
        app: insuretech-app

      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"

    spec:
      containers:
        - name: insuretech-app

          image: ghcr.io/yandex-practicum/scaletestapp:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

          resources:
            requests:
              cpu: 50m
              memory: 20Mi

            limits:
              cpu: 200m
              memory: 30Mi

          readinessProbe:
            httpGet:
              path: /health
              port: 8080

            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8080

            initialDelaySeconds: 5
            periodSeconds: 10